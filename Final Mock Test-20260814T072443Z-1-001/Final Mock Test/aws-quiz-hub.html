<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS Quiz Hub</title>
<style>
/* ════════════════════════════════
   TOKENS
════════════════════════════════ */
:root {
  --bg:         #cdf5d6;
  --card:       #b8dece;
  --border:     #5778ba;
  --text:       #1f2328;
  --muted:      #57606a;
  --accent:     #ff9900;   /* AWS orange */
  --accent-dk:  #cc7a00;
  --navy:       #a76c57;   /* AWS navy */
  --success:    #1a7f37;
  --danger:     #cf222e;
  --success-bg: #e6f9ee;
  --danger-bg:  #fce8e8;
  --surface:    #f7f8fa;
}

/* ════════════════════════════════
   RESET & BASE
════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.65;
  color: var(--text);
  background: var(--bg);
  min-height: 100vh;
}

/* ════════════════════════════════
   HEADER
════════════════════════════════ */
header {
  background: linear-gradient(135deg, var(--navy) 0%, #565757 100%);
  color: #fff;
  padding: 24px 32px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.logo-badge {
  background: var(--accent);
  color: var(--navy);
  font-size: 13px;
  font-weight: 800;
  padding: 6px 12px;
  border-radius: 8px;
  letter-spacing: 0.5px;
  white-space: nowrap;
}
header h1 { font-size: 20px; font-weight: 700; }
header p  { font-size: 13px; opacity: 0.75; margin-top: 2px; }

/* ════════════════════════════════
   SCREENS
════════════════════════════════ */
.screen { display: none; }
.screen.active { display: block; }

/* ════════════════════════════════
   SCREEN 1 — SERVICE SELECTOR
════════════════════════════════ */
#screen-select {
  max-width: 1100px;
  margin: 40px auto;
  padding: 0 24px 60px;
}
#screen-select h2 {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 6px;
}
#screen-select .hint {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 28px;
}

.service-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px;
}

.service-card {
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 22px 20px;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
  text-align: center;
}
.service-card:hover {
  border-color: var(--accent);
  box-shadow: 0 4px 16px rgba(255,153,0,0.18);
  transform: translateY(-2px);
}
.service-card.selected {
  border-color: var(--accent);
  background: #fff8ec;
}
.service-card .svc-icon {
  font-size: 32px;
  margin-bottom: 10px;
  display: block;
}
.service-card .svc-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--navy);
}
.service-card .svc-count {
  font-size: 11px;
  color: var(--muted);
  margin-top: 4px;
}

/* ════════════════════════════════
   SCREEN 2 — SET PICKER
════════════════════════════════ */
#screen-sets {
  max-width: 700px;
  margin: 40px auto;
  padding: 0 24px 60px;
}
.back-btn {
  background: none;
  border: 1px solid var(--border);
  padding: 7px 14px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 24px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.back-btn:hover { border-color: var(--accent); color: var(--accent); }

#sets-service-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 6px;
}
#sets-service-hint {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 24px;
}

.set-list { display: flex; flex-direction: column; gap: 12px; }

.set-item {
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 18px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: border-color 0.15s;
}
.set-item:hover { border-color: var(--accent); }
.set-item .set-info .set-name { font-size: 15px; font-weight: 700; }
.set-item .set-info .set-path { font-size: 12px; color: var(--muted); margin-top: 2px; }
.set-item .set-badge {
  background: var(--navy);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 99px;
}
.set-item .set-badge.final { background: var(--accent); color: var(--navy); }

/* ════════════════════════════════
   PROGRESS BAR (quiz)
════════════════════════════════ */
.progress-strip {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 12px 32px;
  display: flex;
  align-items: center;
  gap: 14px;
  position: sticky;
  top: 0;
  z-index: 20;
}
.progress-strip .p-label { font-size: 13px; color: var(--muted); white-space: nowrap; }
.progress-bar-bg {
  flex: 1;
  height: 7px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 99px;
  transition: width 0.35s ease;
  width: 0%;
}
.p-stats {
  display: flex;
  gap: 14px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}
.p-stats .p-correct { color: var(--success); }
.p-stats .p-wrong   { color: var(--danger); }
.p-stats .p-pending { color: var(--muted); }

/* ════════════════════════════════
   SCREEN 3 — QUIZ
════════════════════════════════ */
#screen-quiz {
  max-width: 1060px;
  margin: 32px auto;
  padding: 0 24px 80px;
}

.quiz-header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
  flex-wrap: wrap;
  gap: 10px;
}
.quiz-title-block h2 { font-size: 18px; font-weight: 700; }
.quiz-title-block p  { font-size: 13px; color: var(--muted); margin-top: 2px; }

.q-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 32px 40px;
  margin-bottom: 20px;
  border-left: 5px solid var(--accent);
}

.q-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.q-num-pill {
  background: var(--accent);
  color: var(--navy);
  font-size: 12px;
  font-weight: 800;
  padding: 3px 12px;
  border-radius: 99px;
}
.q-type-pill {
  font-size: 11px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 99px;
  text-transform: capitalize;
}
.q-type-pill.single   { background: #dbeafe; color: #1e40af; }
.q-type-pill.easy     { background: #dcfce7; color: #166534; }
.q-type-pill.moderate { background: #fef9c3; color: #854d0e; }
.q-type-pill.high     { background: #fee2e2; color: #991b1b; }
.q-type-pill.concept  { background: #ede9fe; color: #5b21b6; }
.q-type-pill.scenario { background: #ccfbf1; color: #115e59; }
.q-type-pill.numerical{ background: #ffedd5; color: #9a3412; }

.q-text {
  font-size: 17px;
  font-weight: 600;
  line-height: 1.6;
  margin-bottom: 22px;
  color: var(--text);
}

/* OPTIONS */
.options { display: flex; flex-direction: column; gap: 10px; }
.opt-label {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 18px;
  border: 2px solid var(--border);
  border-radius: 9px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  user-select: none;
}
.opt-label:hover:not(.locked) { border-color: var(--accent); background: #fff8ec; }
.opt-label.locked { cursor: default; }
.opt-key {
  min-width: 32px;
  height: 32px;
  border-radius: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.15s, color 0.15s;
}
.opt-text { font-size: 14.5px; line-height: 1.55; padding-top: 3px; }

/* radio hidden */
.opt-label input[type=radio] { display: none; }

/* SELECTED */
.opt-label.selected { border-color: var(--accent); background: #fff8ec; }
.opt-label.selected .opt-key { background: var(--accent); color: var(--navy); border-color: var(--accent); }

/* CORRECT */
.opt-label.correct { border-color: var(--success); background: var(--success-bg); }
.opt-label.correct .opt-key { background: var(--success); color: #fff; border-color: var(--success); }

/* WRONG */
.opt-label.wrong { border-color: var(--danger); background: var(--danger-bg); }
.opt-label.wrong .opt-key { background: var(--danger); color: #fff; border-color: var(--danger); }

/* highlight correct when user was wrong */
.opt-label.show-correct { border-color: var(--success); background: var(--success-bg); }
.opt-label.show-correct .opt-key { background: var(--success); color: #fff; border-color: var(--success); }

/* SUBMIT BUTTON per-card */
.q-submit-btn {
  margin-top: 16px;
  padding: 9px 24px;
  background: var(--accent);
  color: var(--navy);
  border: none;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.q-submit-btn:hover:not(:disabled) { background: var(--accent-dk); color: #fff; }
.q-submit-btn:disabled { background: var(--border); color: var(--muted); cursor: default; }

/* EXPLANATION */
.explanation {
  margin-top: 18px;
  border-radius: 8px;
  padding: 14px 18px;
  font-size: 13.5px;
  line-height: 1.6;
  display: none;
  border-left: 4px solid var(--accent);
  background: #fffbf0;
}
.explanation.show { display: block; }
.explanation h4 { font-size: 13px; font-weight: 700; color: var(--navy); margin-bottom: 8px; }
.explanation ul { padding-left: 18px; }
.explanation li { margin-bottom: 5px; }
.result-line { font-weight: 700; font-size: 14px; margin-bottom: 10px; }
.result-line.ok  { color: var(--success); }
.result-line.bad { color: var(--danger); }

/* FINISH button */
.finish-row {
  text-align: center;
  margin-top: 32px;
}
.finish-btn {
  padding: 13px 44px;
  background: var(--navy);
  color: #fff;
  border: none;
  border-radius: 9px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}
.finish-btn:hover { background: #37475a; }

/* ════════════════════════════════
   SCREEN 4 — RESULTS
════════════════════════════════ */
#screen-results {
  max-width: 900px;
  margin: 40px auto;
  padding: 0 24px 80px;
}

.score-hero {
  background: linear-gradient(135deg, var(--navy) 0%, #37475a 100%);
  color: #fff;
  border-radius: 14px;
  padding: 40px 36px;
  text-align: center;
  margin-bottom: 28px;
}
.score-ring {
  width: 130px;
  height: 130px;
  border-radius: 50%;
  border: 7px solid var(--accent);
  margin: 0 auto 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.score-ring .pct { font-size: 36px; font-weight: 800; color: var(--accent); }
.score-ring .frac { font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 2px; }
.score-hero h2 { font-size: 22px; font-weight: 700; }
.score-hero .grade-msg { font-size: 15px; opacity: 0.85; margin-top: 8px; }

.result-stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 28px;
}
.r-stat {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 12px;
  text-align: center;
}
.r-stat .val { font-size: 28px; font-weight: 800; }
.r-stat .lbl { font-size: 12px; color: var(--muted); margin-top: 3px; }
.r-stat.total-s .val { color: var(--navy); }
.r-stat.corr-s  .val { color: var(--success); }
.r-stat.wrong-s .val { color: var(--danger); }
.r-stat.skip-s  .val { color: var(--muted); }

/* DOWNLOAD BUTTONS */
.download-row {
  display: flex;
  gap: 12px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}
.dl-btn {
  flex: 1;
  min-width: 200px;
  padding: 14px 18px;
  border-radius: 9px;
  border: 2px solid var(--border);
  background: var(--card);
  cursor: pointer;
  font-size: 14px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: border-color 0.15s;
}
.dl-btn:hover { border-color: var(--accent); }
.dl-btn .dl-icon { font-size: 22px; }
.dl-btn .dl-info .dl-title { font-size: 14px; font-weight: 700; }
.dl-btn .dl-info .dl-sub   { font-size: 11px; color: var(--muted); margin-top: 2px; }
.dl-btn.green { border-left: 5px solid var(--success); }
.dl-btn.red   { border-left: 5px solid var(--danger); }
.dl-btn.blue  { border-left: 5px solid #3b82d4; }

/* REVIEW TABLE */
.review-block { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.review-block .rb-header { padding: 16px 22px; border-bottom: 1px solid var(--border); font-size: 15px; font-weight: 700; }
.review-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.review-table th { background: var(--surface); padding: 9px 14px; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid var(--border); text-align: left; }
.review-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
.review-table tr:last-child td { border-bottom: none; }
.tag-ok  { color: var(--success); font-weight: 700; }
.tag-bad { color: var(--danger);  font-weight: 700; }
.tag-skip { color: var(--muted); font-weight: 700; }

.retry-row { display: flex; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
.btn-primary   { padding: 11px 28px; background: var(--accent);  color: var(--navy); border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
.btn-secondary { padding: 11px 28px; background: var(--card);    color: var(--text); border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
.btn-primary:hover   { background: var(--accent-dk); color: #fff; }
.btn-secondary:hover { border-color: var(--accent); }

/* ════════════════════════════════
   MISC
════════════════════════════════ */
.loading-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 48px;
  text-align: center;
  color: var(--muted);
  font-size: 16px;
}

footer {
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  padding: 20px;
  border-top: 1px solid var(--border);
  background: var(--card);
  margin-top: 40px;
}

@media (max-width: 700px) {
  .service-grid { grid-template-columns: repeat(2, 1fr); }
  .result-stats-grid { grid-template-columns: repeat(2, 1fr); }
  .q-card { padding: 20px 18px; }
  header { flex-direction: column; align-items: flex-start; gap: 8px; }
  .progress-strip { flex-wrap: wrap; padding: 10px 16px; }
}
</style>
</head>
<body>

<!-- ══════════════════════ HEADER ══════════════════════ -->
<header>
  <div class="logo-badge">AWS</div>
  <div>
    <h1>AWS Quiz Hub</h1>
    <p>Select a service → pick a question set → start the quiz</p>
  </div>
</header>

<!-- ══════════════════════ PROGRESS STRIP (quiz only) ══════════════════════ -->
<div class="progress-strip" id="progress-strip" style="display:none;">
  <span class="p-label" id="p-label">Q 1 of 0</span>
  <div class="progress-bar-bg"><div class="progress-bar-fill" id="p-fill"></div></div>
  <div class="p-stats">
    <span class="p-correct" id="p-correct">✓ 0</span>
    <span class="p-wrong"   id="p-wrong">✗ 0</span>
    <span class="p-pending" id="p-pending">— 0 left</span>
  </div>
</div>

<!-- ══════════════════════ SCREEN 1: SERVICE SELECTOR ══════════════════════ -->
<section id="screen-select" class="screen active">
  <h2>Choose an AWS Service</h2>
  <p class="hint">Click a service card to see available question sets.</p>
  <div class="service-grid" id="service-grid"></div>
</section>

<!-- ══════════════════════ SCREEN 2: SET PICKER ══════════════════════ -->
<section id="screen-sets" class="screen">
  <button class="back-btn" onclick="showScreen('screen-select')">← Back to Services</button>
  <h2 id="sets-service-title"></h2>
  <p id="sets-service-hint" class="hint"></p>
  <div class="set-list" id="set-list"></div>
</section>

<!-- ══════════════════════ SCREEN 3: QUIZ ══════════════════════ -->
<section id="screen-quiz" class="screen">
  <div class="quiz-header-row">
    <div class="quiz-title-block">
      <h2 id="quiz-title">Quiz</h2>
      <p id="quiz-subtitle"></p>
    </div>
    <button class="back-btn" onclick="confirmAbort()">✕ Exit Quiz</button>
  </div>
  <div id="quiz-body"></div>
  <div class="finish-row">
    <button class="finish-btn" id="finish-btn" onclick="showResults()">Finish &amp; View Results →</button>
  </div>
</section>

<!-- ══════════════════════ SCREEN 4: RESULTS ══════════════════════ -->
<section id="screen-results" class="screen">
  <div class="score-hero" id="score-hero"></div>
  <div class="result-stats-grid" id="result-stats"></div>

  <div class="download-row">
    <button class="dl-btn green" onclick="downloadReport('correct')">
      <span class="dl-icon">✅</span>
      <div class="dl-info">
        <div class="dl-title">Download Correct Answers</div>
        <div class="dl-sub">HTML report of all questions you got right</div>
      </div>
    </button>
    <button class="dl-btn red" onclick="downloadReport('wrong')">
      <span class="dl-icon">❌</span>
      <div class="dl-info">
        <div class="dl-title">Download Wrong Answers</div>
        <div class="dl-sub">HTML report of all questions you got wrong</div>
      </div>
    </button>
    <button class="dl-btn blue" onclick="downloadReport('all')">
      <span class="dl-icon">📋</span>
      <div class="dl-info">
        <div class="dl-title">Download Full Report</div>
        <div class="dl-sub">Complete quiz report with all questions</div>
      </div>
    </button>
  </div>

  <div class="review-block">
    <div class="rb-header">Answer Review</div>
    <div style="overflow-x:auto">
      <table class="review-table" id="review-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Type</th>
            <th>Question</th>
            <th>Result</th>
            <th>Your Answer</th>
            <th>Correct Answer</th>
          </tr>
        </thead>
        <tbody id="review-body"></tbody>
      </table>
    </div>
  </div>

  <div class="retry-row">
    <button class="btn-primary"   onclick="retakeQuiz()">Retake Same Set</button>
    <button class="btn-secondary" onclick="showScreen('screen-select')">Choose Another Service</button>
  </div>
</section>

<footer>Made with IBM Bob &nbsp;·&nbsp; AWS Quiz Hub</footer>

<!-- ══════════════════════ JAVASCRIPT ══════════════════════ -->
<script>
// ═══════════════════════════════════════════════════════════
//  SERVICE & FILE CATALOGUE

// ═══════════════════════════════════════════════════════════
//  SCREEN ROUTER
// ═══════════════════════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const isQuiz = (id === 'screen-quiz');
  document.getElementById('progress-strip').style.display = isQuiz ? 'flex' : 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ═══════════════════════════════════════════════════════════
//  FISHER-YATES SHUFFLE
// ═══════════════════════════════════════════════════════════
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ═══════════════════════════════════════════════════════════
//  SHUFFLE OPTIONS (keeps correct answer key consistent)
// ═══════════════════════════════════════════════════════════
function shuffleOptions(q) {
  const keys = ['a','b','c','d'];
  const entries = keys.map(k => ({
    key: k, val: q.opts[k], expText: q.exp[k], isAns: k === q.ans
  }));
  const shuffled = shuffle(entries);
  const newOpts = {}, newExp = {};
  let newAns = '';
  shuffled.forEach((e, i) => {
    const nk = keys[i];
    newOpts[nk] = e.val;
    newExp[nk]  = e.expText;
    if (e.isAns) newAns = nk;
  });
  return { ...q, opts: newOpts, exp: newExp, ans: newAns };
}

// ═══════════════════════════════════════════════════════════
//  START QUIZ — fetch JSON → shuffle → render
// ═══════════════════════════════════════════════════════════
async function startQuiz(file, title) {
  currentSetFile = file;
  // Reset state
  shuffledQs   = [];
  userAnswers  = {};
  submittedFlags = {};
  correctCount = 0;
  wrongCount   = 0;

  // Show loading placeholder
  document.getElementById('quiz-title').textContent    = title;
  document.getElementById('quiz-subtitle').textContent = 'Loading questions…';
  document.getElementById('quiz-body').innerHTML =
    '<div class="loading-card">⏳ Loading questions, please wait…</div>';
  showScreen('screen-quiz');

  try {
    const res = await fetch(file);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const raw = await res.json();

    shuffledQs = shuffle(raw).map(shuffleOptions);

    // Init answer tracking
    shuffledQs.forEach((_, i) => {
      userAnswers[i]    = null;
      submittedFlags[i] = false;
    });

    document.getElementById('quiz-subtitle').textContent =
      `${shuffledQs.length} questions · ${title}`;

    renderQuiz();
    updateProgress();

  } catch (err) {
    document.getElementById('quiz-body').innerHTML = `
      <div class="loading-card" style="color:var(--danger)">
        <strong>⚠️ Could not load questions.</strong><br><br>
        ${err.message}<br><br>
        <strong>Tip:</strong> Serve files over HTTP (e.g. VS Code Live Server, or <code>python -m http.server 8080</code>).
        This page uses <code>fetch()</code> and cannot load files directly from the filesystem.
      </div>`;
  }
}

// ═══════════════════════════════════════════════════════════
//  RENDER ALL QUESTION CARDS
// ═══════════════════════════════════════════════════════════
function renderQuiz() {
  const body = document.getElementById('quiz-body');
  body.innerHTML = '';

  shuffledQs.forEach((q, idx) => {
    const num = idx + 1;
    const typePill = `<span class="q-type-pill ${q.type}">${q.type}</span>`;

    const optsHTML = Object.keys(q.opts).map(k => `
      <label class="opt-label" id="lbl_${idx}_${k}" data-idx="${idx}" data-key="${k}">
        <input type="radio" name="q${idx}" value="${k}">
        <span class="opt-key">${k.toUpperCase()}</span>
        <span class="opt-text">${q.opts[k]}</span>
      </label>`).join('');

    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = `card_${idx}`;
    card.innerHTML = `
      <div class="q-meta">
        <span class="q-num-pill">Q ${num}</span>
        ${typePill}
      </div>
      <div class="q-text">${q.q}</div>
      <div class="options" id="opts_${idx}">${optsHTML}</div>
      <button class="q-submit-btn" id="sbtn_${idx}" onclick="submitAnswer(${idx})">Submit Answer</button>
      <div class="explanation" id="exp_${idx}"></div>`;

    body.appendChild(card);
  });

  // Attach option click listeners
  document.querySelectorAll('.opt-label').forEach(lbl => {
    lbl.addEventListener('click', function() {
      const idx = parseInt(this.dataset.idx);
      const key = this.dataset.key;
      if (submittedFlags[idx]) return;
      selectOption(idx, key);
    });
  });
}

// ═══════════════════════════════════════════════════════════
//  SELECT OPTION (before submit)
// ═══════════════════════════════════════════════════════════
function selectOption(idx, key) {
  userAnswers[idx] = key;
  const opts = document.querySelectorAll(`#opts_${idx} .opt-label`);
  opts.forEach(o => o.classList.remove('selected'));
  const chosen = document.getElementById(`lbl_${idx}_${key}`);
  if (chosen) chosen.classList.add('selected');
}

// ═══════════════════════════════════════════════════════════
//  SUBMIT ANSWER
// ═══════════════════════════════════════════════════════════
function submitAnswer(idx) {
  const selected = userAnswers[idx];
  if (!selected) { alert('Please select an option first!'); return; }
  if (submittedFlags[idx]) return;

  submittedFlags[idx] = true;

  const q          = shuffledQs[idx];
  const correct    = q.ans;
  const isCorrect  = selected === correct;

  if (isCorrect) correctCount++; else wrongCount++;

  // Style all labels
  const allLabels = document.querySelectorAll(`#opts_${idx} .opt-label`);
  allLabels.forEach(lbl => {
    lbl.classList.add('locked');
    lbl.classList.remove('selected');
    const k = lbl.dataset.key;
    if (k === correct && !isCorrect)   lbl.classList.add('show-correct');
    if (k === correct && isCorrect)    lbl.classList.add('correct');
    if (k === selected && !isCorrect)  lbl.classList.add('wrong');
  });

  // Disable submit button
  const btn = document.getElementById(`sbtn_${idx}`);
  btn.disabled    = true;
  btn.textContent = isCorrect ? '✅ Correct!' : '❌ Incorrect';

  // Build explanation
  const resultLine = isCorrect
    ? `<div class="result-line ok">✅ Correct! You chose ${selected.toUpperCase()}</div>`
    : `<div class="result-line bad">❌ Wrong. You chose ${selected.toUpperCase()} — Correct: ${correct.toUpperCase()}</div>`;

  const optList = Object.keys(q.opts).map(k =>
    `<li><strong>${k.toUpperCase()}) ${q.opts[k]}</strong><br>→ ${q.exp[k]}</li>`
  ).join('');

  const expEl = document.getElementById(`exp_${idx}`);
  expEl.innerHTML = `
    ${resultLine}
    <h4>📖 Analysis of each option:</h4>
    <ul>${optList}</ul>`;
  expEl.classList.add('show');

  updateProgress();
}

// ═══════════════════════════════════════════════════════════
//  UPDATE PROGRESS BAR
// ═══════════════════════════════════════════════════════════
function updateProgress() {
  const total      = shuffledQs.length;
  const answered   = Object.values(submittedFlags).filter(Boolean).length;
  const remaining  = total - answered;
  const pct        = total ? (answered / total) * 100 : 0;

  document.getElementById('p-label').textContent   = `${answered} / ${total} answered`;
  document.getElementById('p-fill').style.width    = pct + '%';
  document.getElementById('p-correct').textContent = `✓ ${correctCount}`;
  document.getElementById('p-wrong').textContent   = `✗ ${wrongCount}`;
  document.getElementById('p-pending').textContent = `— ${remaining} left`;
}

// ═══════════════════════════════════════════════════════════
//  CONFIRM ABORT
// ═══════════════════════════════════════════════════════════
function confirmAbort() {
  const answered = Object.values(submittedFlags).filter(Boolean).length;
  if (answered === 0 || confirm(`You have answered ${answered} question(s). Exit and lose progress?`)) {
    showScreen('screen-select');
    document.getElementById('progress-strip').style.display = 'none';
  }
}

// ═══════════════════════════════════════════════════════════
//  SHOW RESULTS
// ═══════════════════════════════════════════════════════════
function showResults() {
  const total    = shuffledQs.length;
  const answered = Object.values(submittedFlags).filter(Boolean).length;
  const skipped  = total - answered;
  const pct      = answered ? Math.round((correctCount / answered) * 100) : 0;
  const pctTotal = Math.round((correctCount / total) * 100);

  // Grade
  let grade, gradeColor, msg;
  if (pctTotal >= 85) { grade = 'A — Excellent!'; gradeColor = '#1a7f37'; msg = '🏆 Outstanding! You have mastered this topic.'; }
  else if (pctTotal >= 70) { grade = 'B — Good'; gradeColor = '#3b82d4'; msg = '👍 Good work! Review the questions you missed.'; }
  else if (pctTotal >= 55) { grade = 'C — Pass'; gradeColor = '#d97706'; msg = '📚 Passed, but review the weak areas carefully.'; }
  else { grade = 'D — Needs Work'; gradeColor = '#cf222e'; msg = '💪 Keep studying! Go back to the study guide.'; }

  // Score hero
  document.getElementById('score-hero').innerHTML = `
    <div class="score-ring">
      <div class="pct">${pctTotal}%</div>
      <div class="frac">${correctCount} / ${total}</div>
    </div>
    <h2>${grade}</h2>
    <div class="grade-msg">${msg}</div>`;

  // Stats grid
  document.getElementById('result-stats').innerHTML = `
    <div class="r-stat total-s"><div class="val">${total}</div><div class="lbl">Total</div></div>
    <div class="r-stat corr-s" ><div class="val">${correctCount}</div><div class="lbl">Correct</div></div>
    <div class="r-stat wrong-s"><div class="val">${wrongCount}</div><div class="lbl">Wrong</div></div>
    <div class="r-stat skip-s" ><div class="val">${skipped}</div><div class="lbl">Skipped</div></div>`;

  // Review table
  const tbody = document.getElementById('review-body');
  tbody.innerHTML = '';
  shuffledQs.forEach((q, i) => {
    const sub  = submittedFlags[i];
    const sel  = userAnswers[i];
    const ok   = sub && sel === q.ans;
    const bad  = sub && sel !== q.ans;
    const skip = !sub;

    const statusCell = skip ? `<span class="tag-skip">— Skipped</span>`
                     : ok   ? `<span class="tag-ok">✓ Correct</span>`
                     :        `<span class="tag-bad">✗ Wrong</span>`;

    const yourAns = skip ? '—' : `${sel.toUpperCase()}) ${q.opts[sel]}`;
    const corrAns = `${q.ans.toUpperCase()}) ${q.opts[q.ans]}`;
    const shortQ  = q.q.length > 80 ? q.q.slice(0, 80) + '…' : q.q;

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${i + 1}</td>
      <td><span class="q-type-pill ${q.type}" style="font-size:10px">${q.type}</span></td>
      <td>${shortQ}</td>
      <td>${statusCell}</td>
      <td style="font-size:12px">${yourAns}</td>
      <td style="font-size:12px;color:var(--success);font-weight:600">${corrAns}</td>`;
    tbody.appendChild(tr);
  });

  showScreen('screen-results');
}

// ═══════════════════════════════════════════════════════════
//  DOWNLOAD REPORT  (generates self-contained HTML file)
// ═══════════════════════════════════════════════════════════
function downloadReport(mode) {
  const total    = shuffledQs.length;
  const pctTotal = Math.round((correctCount / total) * 100);
  const setLabel = document.getElementById('quiz-title').textContent;
  const now      = new Date().toLocaleString();

  // Filter questions
  let filtered;
  if (mode === 'correct') {
    filtered = shuffledQs.map((q, i) => ({ q, i }))
                         .filter(({ i }) => submittedFlags[i] && userAnswers[i] === shuffledQs[i].ans);
  } else if (mode === 'wrong') {
    filtered = shuffledQs.map((q, i) => ({ q, i }))
                         .filter(({ i }) => submittedFlags[i] && userAnswers[i] !== shuffledQs[i].ans);
  } else {
    filtered = shuffledQs.map((q, i) => ({ q, i }));
  }

  const modeLabel = mode === 'correct' ? 'Correct Answers Report'
                  : mode === 'wrong'   ? 'Wrong Answers Report'
                  :                      'Full Quiz Report';
  const modeColor = mode === 'correct' ? '#1a7f37'
                  : mode === 'wrong'   ? '#cf222e'
                  :                      '#232f3e';

  // Build question blocks
  const qBlocks = filtered.map(({ q, i }) => {
    const sel  = userAnswers[i];
    const sub  = submittedFlags[i];
    const ok   = sub && sel === q.ans;
    const skip = !sub;

    const statusText = skip ? '— Skipped' : ok ? '✅ Correct' : '❌ Wrong';
    const statusColor = skip ? '#57606a' : ok ? '#1a7f37' : '#cf222e';

    const optRows = Object.keys(q.opts).map(k => {
      let bg = '#fff', border = '#e5e7eb', fw = 'normal';
      if (k === q.ans)                    { bg = '#e6f9ee'; border = '#1a7f37'; fw = 'bold'; }
      if (k === sel && sel !== q.ans)     { bg = '#fce8e8'; border = '#cf222e'; }
      return `<div style="margin:5px 0;padding:10px 14px;border:2px solid ${border};border-radius:7px;background:${bg};font-weight:${fw}">
                <strong>${k.toUpperCase()})</strong> ${q.opts[k]}<br>
                <span style="font-size:12px;color:#57606a">→ ${q.exp[k]}</span>
              </div>`;
    }).join('');

    const yourAnsLine = skip ? '' : `<p style="margin:10px 0 4px;font-size:13px;color:${statusColor};font-weight:700">
      ${ok ? '✅ You answered: ' : '❌ You answered: '} ${sel ? sel.toUpperCase() + ') ' + q.opts[sel] : '—'}
    </p>`;
    const corrLine = `<p style="margin:4px 0 12px;font-size:13px;color:#1a7f37;font-weight:700">
      ✔ Correct answer: ${q.ans.toUpperCase()}) ${q.opts[q.ans]}
    </p>`;

    return `<div style="background:#fff;border:1px solid #e5e7eb;border-left:5px solid ${statusColor};border-radius:10px;padding:22px 26px;margin-bottom:20px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <span style="background:#ff9900;color:#232f3e;font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px">Q ${i + 1}</span>
        <span style="font-size:11px;background:#f0f4f8;padding:3px 8px;border-radius:99px">${q.type}</span>
        <span style="font-size:12px;font-weight:700;color:${statusColor}">${statusText}</span>
      </div>
      <p style="font-size:16px;font-weight:600;line-height:1.6;margin-bottom:16px">${q.q}</p>
      ${optsHTML_placeholder(q.opts, q.exp, sel, q.ans)}
      ${yourAnsLine}
      ${corrLine}
    </div>`;
  }).join('');

  function optsHTML_placeholder(opts, exp, sel, ans) {
    return Object.keys(opts).map(k => {
      let bg = '#fff', border = '#e5e7eb', fw = 'normal';
      if (k === ans)              { bg = '#e6f9ee'; border = '#1a7f37'; fw = 'bold'; }
      if (k === sel && sel !== ans) { bg = '#fce8e8'; border = '#cf222e'; }
      return `<div style="margin:5px 0;padding:10px 14px;border:2px solid ${border};border-radius:7px;background:${bg};font-weight:${fw}">
                <strong>${k.toUpperCase()})</strong> ${opts[k]}<br>
                <span style="font-size:12px;color:#57606a">→ ${exp[k]}</span>
              </div>`;
    }).join('');
  }

  // Build the report by joining an array of strings.
  // Closing tags that would confuse the HTML parser are written as escaped
  // sequences inside string literals (e.g. '<\/style>') rather than as raw
  // text, so the browser never mistakes them for real document-level tags.
  const reportCSS = [
    'body{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;background:#f0f4f8;margin:0;padding:0}',
    '.wrap{max-width:900px;margin:32px auto;padding:0 20px 60px}',
    '.report-header{background:linear-gradient(135deg,#232f3e,#37475a);color:#fff;border-radius:12px;padding:32px 36px;margin-bottom:28px}',
    '.report-header h1{font-size:22px;color:' + (modeColor === '#232f3e' ? '#ff9900' : modeColor) + ';margin-bottom:6px}',
    '.report-header p{font-size:13px;opacity:0.8}',
    '.stat-row{display:flex;gap:14px;margin-top:16px;flex-wrap:wrap}',
    '.stat-chip{background:rgba(255,255,255,0.15);padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700}',
    'footer{text-align:center;font-size:11px;color:#57606a;padding:20px;border-top:1px solid #e5e7eb;margin-top:32px}'
  ].join('');

  const noQMsg = filtered.length === 0
    ? '<div style="background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:40px;text-align:center;color:#57606a">No questions in this category.<\/div>'
    : qBlocks;

  const parts = [
    '<!DOCTYPE html>',
    '<html lang="en"><head><meta charset="UTF-8">',
    '<title>' + modeLabel + ' \u2014 ' + setLabel + '<\/title>',
    '<style>' + reportCSS + '<\/style>',
    '<\/head><body>',
    '<div class="wrap">',
    '<div class="report-header">',
    '<h1>' + modeLabel + '<\/h1>',
    '<p>' + setLabel + ' &nbsp;\u00b7&nbsp; Generated: ' + now + '<\/p>',
    '<div class="stat-row">',
    '<div class="stat-chip">Total: '    + total         + '<\/div>',
    '<div class="stat-chip">Correct: '  + correctCount  + '<\/div>',
    '<div class="stat-chip">Wrong: '    + wrongCount    + '<\/div>',
    '<div class="stat-chip">Score: '    + pctTotal      + '%<\/div>',
    '<div class="stat-chip">Showing: '  + filtered.length + ' question(s)<\/div>',
    '<\/div><\/div>',
    noQMsg,
    '<footer>AWS Quiz Hub &nbsp;\u00b7&nbsp; Made with IBM Bob<\/footer>',
    '<\/div><\/body><\/html>'
  ];
  const html = parts.join('');

  // Trigger download
  const blob = new Blob([html], { type: 'text/html' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  const safeName = setLabel.replace(/[^a-z0-9]/gi, '_').toLowerCase();
  a.href     = url;
  a.download = `${safeName}_${mode}_report.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ═══════════════════════════════════════════════════════════
//  RETAKE QUIZ (same file, re-shuffle)
// ═══════════════════════════════════════════════════════════
function retakeQuiz() {
  const title = document.getElementById('quiz-title').textContent;
  startQuiz(currentSetFile, title);
}

//  INIT
// ═══════════════════════════════════════════════════════════
buildServiceGrid();
</script>
